name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Launcher JVM only - the Gradle daemon provisions its own JDK 21
      # via gradle/gradle-daemon-jvm.properties (foojay toolchain URLs).
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # google-services.json is gitignored (per-developer Firebase config), so
      # CI rebuilds it from a repository secret (base64 of the file).
      #
      # A pull request from a fork gets no secrets — by design, and not
      # something to work around. It falls back to the checked-in placeholder,
      # which is enough for everything CI actually does: the Gradle plugin only
      # needs a well-formed config, unit tests run against fakes, and the
      # instrumented ones are Room-level and never reach the network.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON secret (fork pull request) — using the placeholder config."
            cp .github/ci/google-services.json app/google-services.json
          fi

      - name: Build and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # The security rules are the most safety-critical artifact in the repo and
  # they had a test suite nothing ever ran automatically: a loosened rule could
  # merge green and ship a live hole.
  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Firestore emulator that hosts the tests is a Java process.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Install dependencies
        working-directory: firestore-tests
        run: npm ci

      # npm test shells out to `firebase emulators:exec`.
      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Run rules tests
        working-directory: firestore-tests
        run: npm test

  # Migration and Room-level sync tests only exist here: the constraints they
  # cover (foreign keys, the unique item slot) are SQLite behaviour, and a
  # broken migration would otherwise ship as a crash-on-upgrade.
  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      # The emulator needs hardware acceleration; runners ship KVM but not the
      # permissions to use it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
