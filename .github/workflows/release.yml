name: Release

# Tag-driven: `git tag v0.1.0 && git push --tags` builds that version, signs it
# and hands it to Firebase App Distribution, which notifies the testers. Nothing
# here runs on ordinary pushes, and nothing about it is reachable from a fork.
on:
  push:
    tags: ['v*']
  # A dry run: builds and signs without distributing, for checking the release
  # variant before it reaches anyone.
  workflow_dispatch:
    inputs:
      distribute:
        description: 'Send the build to testers'
        type: boolean
        default: false

jobs:
  release:
    name: Build and distribute
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The real Firebase config: a release build has to talk to the actual
      # project, so unlike the CI jobs there is no placeholder fallback here.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is missing; a release must not be built against a placeholder project."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      # Written outside the workspace so it cannot end up in an artifact.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is missing; the APK would be unsigned and uninstallable."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # The version comes from the tag: v0.1.0 -> versionName 0.1.0. versionCode
      # is the run number, which only ever grows — Android refuses to install an
      # update whose code is not higher, and a hand-kept counter is one rebase
      # away from going backwards.
      - name: Derive the version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "SHELFIE_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "SHELFIE_VERSION_NAME=0.0.0-dev" >> "$GITHUB_ENV"
          fi
          echo "SHELFIE_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build the signed release
        env:
          SHELFIE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SHELFIE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SHELFIE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SHELFIE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # Signed, not merely built: an unsigned APK installs nowhere, and finding
      # that out from the tester is the wrong way round.
      - name: Verify the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          # Whatever build-tools the build just provisioned; a pinned version
          # here would break the day compileSdk moves.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"

      - name: Distribute to testers
        if: github.ref_type == 'tag' || inputs.distribute
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: household
          file: app/build/outputs/apk/release/app-release.apk
          releaseNotes: ${{ github.ref_type == 'tag' && github.ref_name || 'manual build' }}
